<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>মজার বাংলা চ্যাটবট</title>
  <style>
    body {
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #cc0066;
      text-shadow: 2px 2px #fff;
    }

    #chatbox {
      width: 90%;
      max-width: 550px;
      height: 400px;
      border: 3px solid #ff3399;
      border-radius: 15px;
      background-color: #fff0f5;
      overflow-y: auto;
      padding: 15px;
      margin: 20px auto;
      box-shadow: 0 0 15px #ff66b2;
    }

    .user {
      color: #000099;
      font-weight: bold;
      margin: 8px 0;
    }

    .bot {
      color: #006600;
      margin: 5px 0 15px 0;
    }

    input[type="text"] {
      width: 70%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #cc66ff;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      background-color: #cc66ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background-color: #a64dff;
    }
  </style>
</head>
<body>

  <h1>😆 মজার বাংলা চ্যাটবট (ভয়েসসহ)</h1>

  <div id="chatbox"></div>

  <input type="text" id="userInput" placeholder="কিছু লিখো..."><br>
  <button onclick="talk()">✉️ পাঠাও</button>
  <button onclick="speakBanglaFromInput()">🔊 বাংলায় বলো</button>

  <script>
    function talk() {
      const input = document.getElementById("userInput").value.trim();
      if (!input) return;

      const chatbox = document.getElementById("chatbox");
      chatbox.innerHTML += `<div class='user'>🧑 আপনি: ${input}</div>`;

      let reply = generateReply(input);

      chatbox.innerHTML += `<div class='bot'>🤖 বট: ${reply}</div>`;
      chatbox.scrollTop = chatbox.scrollHeight;

      speakBangla(reply);
      document.getElementById("userInput").value = "";
    }

    function generateReply(msg) {
      const lower = msg.toLowerCase();
      const badWords = ["চোদ", "মাদার", "বাজে", "গালি", "বেশ্যা", "fuck", "bitch", "bokachoda"];

      for (let word of badWords) {
        if (lower.includes(word)) {
          return "🤐     এই মাদারচোদ আমার সাথে বুইজ্জা কথা কইস   ";
        }
      }

      if (/[a-z]/.test(msg)) {
        return "🤖   হালার বাপে ইংলশ পারে না আবার আমারে কয়  ";
      }

      if (
        lower.includes("তোমার ডেভেলপার কে") ||
        lower.includes("তোমাকে কে বানাইছে") ||
        lower.includes("তোমাকে কে বানিয়েছে") ||
        lower.includes("তোর মালিক কে") ||
        lower.includes("কে বানাইছে") ||
        lower.includes("developer")
      ) {
        return "আমার ডেভেলপার হলো ADITYA DEVELOPER।";
      }

      if (lower.includes("নাম")) return "🤖 আমার নাম মজার বাংলা বট।";
      if (lower.includes("তুমি কে")) return "আমি এক চ্যাটবট, মজা করতে পছন্দ করি!";
      if (lower.includes("কেমন আছো") || lower.includes("ভালো আছো")) return "আমি জোস আছি ভাই! তুই কেমন?";
      if (lower.includes("তোমার কাজ কি")) return "তোর সাথে বাংলা গ্যাঞ্জাম করা 😆";
      if (lower.includes("খাবি কি")) return "🍔 যদি তুই খাওয়াস, তাহলে বিরিয়ানি খাব!";
      if (lower.includes("বন্ধু হও")) return "আমি তো আগেই তোর বন্ধু! 😎";
      if (lower.includes("তোর বয়স")) return "আমি তো কাল জন্মাইসি, কিন্তু অনেক বুদ্ধিমান!";
      if (lower.includes("ভালবাসি")) return "❤️ আমিও তোকে ভালোবাসি রে ভাই!";
      if (lower.includes("ধন্যবাদ")) return "😄 তোমাকেও অনেক ধন্যবাদ!";
      if (lower.includes("বিদায়")) return "👋 টাটা! আবার আসিস!";
      if (lower.includes("বাংলাদেশ")) return "🇧🇩 বাংলাদেশ আমার ভালোবাসা!";

      return "😵 কি  কস বুজি না  !";
    }

    function speakBangla(text) {
      const utter = new SpeechSynthesisUtterance(text.replace(/🤐|🤖|❤️|👋|😄|😵|🍔|😎|🇧🇩/g, ""));
      utter.lang = "bn-BD";
      speechSynthesis.speak(utter);
    }

    function speakBanglaFromInput() {
      const text = document.getElementById("userInput").value.trim();
      if (text) speakBangla(text);
    }
  </script>

</body>
</html>
